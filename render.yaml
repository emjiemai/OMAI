# Render Blueprint (same pattern as mgmg-agents): one Postgres, one always-on API that also runs the schedule.
databases:
  - name: omai-db
    databaseName: omai
    user: omai
    plan: basic-256mb
    postgresMajorVersion: 16
services:
  - type: web
    name: omai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: omai-db, property: connectionString }
    # Secrets come from the existing shared environment group (the one mgmg-agents uses); OMAI reads only:
    # ENVIRONMENT, DRY_RUN, TZ, SAP_PUSH_WEBHOOK_SECRET, ONEC_ODATA_URL, ONEC_LOGIN, ONEC_PASSWORD,
    # BILLZ_SECRET_TOKEN — plus the two company bot tokens, only to refuse them as OMAI's own (docs/backend.md §6).
      - fromGroup: mgmg-shared
    # OMAI's own Telegram bot (@BotFather) — on this service only, never in mgmg-shared.
      - key: OMAI_TELEGRAM_BOT_TOKEN
        sync: false
