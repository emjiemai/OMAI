# Render Blueprint (same pattern as mgmg-agents): one Postgres, one always-on API that also runs the schedule.
databases:
  - name: omai-db
    databaseName: omai
    user: omai
    plan: basic-256mb
    postgresMajorVersion: 16
services:
  - type: web
    name: omai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # Only what OMAI reads — no fromGroup, so the service does not receive the company's other secrets
    # (mgmg-shared stays as it is: mgmg-api runs on it). Values marked sync:false are entered once in Render.
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: omai-db, property: connectionString }
      - key: ENVIRONMENT
        value: production
      - key: TZ
        value: Asia/Tashkent
      - key: DRY_RUN
        value: "false"
      - key: OMAI_TELEGRAM_BOT_TOKEN     # OMAI's own bot (@BotFather), never a company bot
        sync: false
      - key: SAP_PUSH_WEBHOOK_SECRET     # same value as in mgmg-shared
        sync: false
      - key: MGMG_SAP_READER_URL         # omai_reader on mgmg-db (scripts/mgmg_reader.sql), read-only
        sync: false
      - key: ONEC_ODATA_URL
        value: https://clobus.uz/a/acc313/61458/odata/standard.odata/
      - key: ONEC_LOGIN
        sync: false
      - key: ONEC_PASSWORD
        sync: false
      - key: BILLZ_SECRET_TOKEN
        sync: false
